[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vgi-xgboost"
version = "0.1.0"
description = "A VGI worker exposing XGBoost (train/predict registry + interpretation) to DuckDB/SQL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "vgi-python[http,oauth]>=0.50.0",
    "vgi-rpc[sentry]>=0.53.1",
    "xgboost>=2.0",
    "scikit-learn>=1.5",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "haybarn"]

[tool.setuptools]
packages = ["vgi_xgboost"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["vgi_xgboost", "xgboost_worker.py", "serve.py"]

[tool.vgi-lint-check.execution]
# Serialize the execute pass. By default it fans out one cursor per CPU, and on a
# 4-core runner each cursor's worker process cold-imports xgboost + scikit-learn
# and trains with every core, so the scans starve each other: even the in-memory
# breast_cancer/diabetes scans (and three executable examples that take ~1s when
# run alone) missed the 10s/30s caps in CI. The fit/search/cross-validation
# functions must consume their whole input and train before emitting a first
# batch, so their scan window is widened to the per-query timeout; the
# per-query timeout itself is unchanged.
concurrency = 1
scan_timeout = 30

[tool.vgi-lint-check.per_object]
# VGI901/902/911 (--execute only) run each example's SQL / a scan live. These functions read a
# *stored* model at bind time, so their single-statement illustrative examples
# cannot bind in a fresh session (no model exists yet) — the fit->predict workflow
# is demonstrated in the catalog's vgi.executable_examples instead. This is a
# surgical, documented exception scoped to exactly the model-dependent functions;
# every other example binds and runs on real/inline data.
"xgboost.main.predict" = { ignore = [{ code = "VGI911", kind = "domain-exemption", reason = "VGI911 (--execute only) scans each table function; this one reads a *stored* model at bind time, so a scan in a fresh session has no model to read. The fit->predict workflow is exercised by the catalog vgi.executable_examples." }, { code = "VGI901", kind = "domain-exemption", reason = "VGI901/902 (--execute only) run each example's SQL live. These functions read a *stored* model at bind time, so their single-statement illustrative examples cannot bind in a fresh session (no model exists yet) — the fit->predict workflow is demonstrated in the catalog's vgi.executable_examples in..." }, { code = "VGI902", kind = "domain-exemption", reason = "VGI901/902 (--execute only) run each example's SQL live. These functions read a *stored* model at bind time, so their single-statement illustrative examples cannot bind in a fresh session (no model exists yet) — the fit->predict workflow is demonstrated in the catalog's vgi.executable_examples in..." }] }
