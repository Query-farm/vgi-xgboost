"xgboost.main.feature_importance" = { ignore = [{ code = "VGI911", kind = "domain-exemption", reason = "VGI911 (--execute only) scans each table function; this one reads a *stored* model at bind time, so a scan in a fresh session has no model to read. The fit->predict workflow is exercised by the catalog vgi.executable_examples." }, { code = "VGI901", kind = "domain-exemption", reason = "VGI901/902 (--execute only) run each example's SQL live. These functions read a *stored* model at bind time, so their single-statement illustrative examples cannot bind in a fresh session (no model exists yet) — the fit->predict workflow is demonstrated in the catalog's vgi.executable_examples in..." }, { code = "VGI902", kind = "domain-exemption", reason = "VGI901/902 (--execute only) run each example's SQL live. These functions read a *stored* model at bind time, so their single-statement illustrative examples cannot bind in a fresh session (no model exists yet) — the fit->predict workflow is demonstrated in the catalog's vgi.executable_examples in..." }] }
"xgboost.main.permutation_importance" = { ignore = [{ code = "VGI911", kind = "domain-exemption", reason = "VGI911 (--execute only) scans each table function; this one reads a *stored* model at bind time, so a scan in a fresh session has no model to read. The fit->predict workflow is exercised by the catalog vgi.executable_examples." }, { code = "VGI901", kind = "domain-exemption", reason = "VGI901/902 (--execute only) run each example's SQL live. These functions read a *stored* model at bind time, so their single-statement illustrative examples cannot bind in a fresh session (no model exists yet) — the fit->predict workflow is demonstrated in the catalog's vgi.executable_examples in..." }, { code = "VGI902", kind = "domain-exemption", reason = "VGI901/902 (--execute only) run each example's SQL live. These functions read a *stored* model at bind time, so their single-statement illustrative examples cannot bind in a fresh session (no model exists yet) — the fit->predict workflow is demonstrated in the catalog's vgi.executable_examples in..." }] }
"xgboost.main.partial_dependence" = { ignore = [{ code = "VGI911", kind = "domain-exemption", reason = "VGI911 (--execute only) scans each table function; this one reads a *stored* model at bind time, so a scan in a fresh session has no model to read. The fit->predict workflow is exercised by the catalog vgi.executable_examples." }, { code = "VGI901", kind = "domain-exemption", reason = "VGI901/902 (--execute only) run each example's SQL live. These functions read a *stored* model at bind time, so their single-statement illustrative examples cannot bind in a fresh session (no model exists yet) — the fit->predict workflow is demonstrated in the catalog's vgi.executable_examples in..." }, { code = "VGI902", kind = "domain-exemption", reason = "VGI901/902 (--execute only) run each example's SQL live. These functions read a *stored* model at bind time, so their single-statement illustrative examples cannot bind in a fresh session (no model exists yet) — the fit->predict workflow is demonstrated in the catalog's vgi.executable_examples in..." }] }
# Public API shape, not metadata gaps: renaming or retyping these would break
# existing SQL, and each finding describes an intentional design.
"xgboost.main.list_models" = { ignore = [{ code = "VGI142", kind = "domain-exemption", reason = "list_models is the published registry-listing API name (function and table); renaming it would break existing queries, and the bare name models would read as the model BLOB." }] }
"xgboost.main.grid_search" = { ignore = [{ code = "VGI316", kind = "domain-exemption", reason = "estimator is a hyperparameter grid (a UNION of per-estimator STRUCTs of candidate-value lists), not row data; a table input would lose the typed per-estimator parameter names." }] }
"xgboost.main.randomized_search" = { ignore = [{ code = "VGI316", kind = "domain-exemption", reason = "estimator is a hyperparameter search space (a UNION of per-estimator STRUCTs of candidate-value lists), not row data; a table input would lose the typed per-estimator parameter names." }] }
"xgboost" = { ignore = [{ code = "VGI205", kind = "domain-exemption", reason = "target is each dataset's label: INTEGER class ids for classification sets, DOUBLE for regression sets, and the label column name (VARCHAR) in list_models; the type follows the task by design." }, { code = "VGI315", kind = "domain-exemption", reason = "estimator names the estimator (VARCHAR) on fit/cross_val_*, but on grid_search/randomized_search it carries the typed search space as a UNION; the shared name keeps the call shape parallel." }] }
