# Private graders for `vgi-lint simulate` (VGI416). The worker publishes only
# task names and prompts in vgi.agent_test_tasks; the canonical solutions
# (reference_sql) stay here in the repo, never in the catalog metadata.
# Training is reproducible, so grading compares results exactly.
tasks:
- name: breast_cancer_cv_accuracy
  reference_sql: SELECT avg(score) AS mean_cv_accuracy FROM xgboost.main.cross_val_score((SELECT * EXCLUDE
    (sample_id, target_name) FROM xgboost.main.breast_cancer), estimator := 'xgb_classifier', target :=
    'target', cv := 5)
- name: iris_grid_search_best_accuracy
  reference_sql: 'SELECT max(mean_test_score) AS best_cv_accuracy FROM xgboost.main.grid_search((SELECT
    sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM xgboost.main.iris),
    target := ''target'', id := ''sample_id'', cv := 5, estimator := union_value(xgb_classifier := {''n_estimators'':
    [30, 60, 90], ''max_depth'': [2, 4, 6]}))'
- name: diabetes_predict_rmse
  reference_sql:
  - SET VARIABLE diab_model = (SELECT model FROM xgboost.main.fit((SELECT * FROM xgboost.main.diabetes),
    estimator := 'xgb_regressor', target := 'target', id := 'sample_id'))
  - SELECT round(sqrt(avg((p.prediction - d.target) * (p.prediction - d.target))), 2) AS train_rmse FROM
    xgboost.main.predict((SELECT * FROM xgboost.main.diabetes), model := getvariable('diab_model'), id
    := 'sample_id') p JOIN xgboost.main.diabetes d USING (sample_id)
- name: n_features_above_mean_gain
  reference_sql:
  - SET VARIABLE diab_gain_model = (SELECT model FROM xgboost.main.fit((SELECT * FROM xgboost.main.diabetes),
    estimator := 'xgb_regressor', target := 'target', id := 'sample_id'))
  - WITH fi AS (SELECT feature, importance FROM xgboost.main.feature_importance('', model := getvariable('diab_gain_model'),
    importance_type := 'gain')) SELECT count(*) AS n_above_mean FROM fi WHERE importance > (SELECT avg(importance)
    FROM fi)
- name: wine_sample_count
  reference_sql: SELECT count(*) AS n FROM xgboost.main.wine
- name: california_housing_count
  reference_sql: SELECT count(*) AS n FROM xgboost.main.california_housing
- name: make_classification_rows
  reference_sql: SELECT count(*) AS n FROM xgboost.main.make_classification(n_samples := 120, n_classes
    := 3, random_state := 42)
- name: make_regression_rows
  reference_sql: SELECT count(*) AS n FROM xgboost.main.make_regression(n_samples := 90, random_state
    := 42)
- name: fit_xgb_classifier_summary
  reference_sql: SELECT n_samples, n_features FROM xgboost.main.fit_xgb_classifier((SELECT * FROM xgboost.main.iris),
    target := 'target', id := 'sample_id')
- name: fit_xgb_regressor_summary
  reference_sql: SELECT n_samples, n_features FROM xgboost.main.fit_xgb_regressor((SELECT * FROM xgboost.main.diabetes),
    target := 'target', id := 'sample_id')
- name: fit_xgb_rf_classifier_summary
  reference_sql: SELECT n_samples, n_features FROM xgboost.main.fit_xgb_rf_classifier((SELECT * FROM xgboost.main.iris),
    target := 'target', id := 'sample_id')
- name: fit_xgb_rf_regressor_summary
  reference_sql: SELECT n_samples, n_features FROM xgboost.main.fit_xgb_rf_regressor((SELECT * FROM xgboost.main.diabetes),
    target := 'target', id := 'sample_id')
- name: cross_val_predict_accuracy
  reference_sql: SELECT round(avg((p.prediction = i.target)::INT), 4) AS oof_accuracy FROM xgboost.main.cross_val_predict((SELECT
    * FROM xgboost.main.iris), estimator := 'xgb_classifier', target := 'target', id := 'sample_id', cv
    := 5) p JOIN xgboost.main.iris i USING (sample_id)
- name: shap_top_feature
  reference_sql:
  - SET VARIABLE shap_model = (SELECT model FROM xgboost.main.fit((SELECT * FROM xgboost.main.diabetes),
    estimator := 'xgb_regressor', target := 'target', id := 'sample_id'))
  - SELECT feature FROM xgboost.main.explain((SELECT * FROM xgboost.main.diabetes), model := getvariable('shap_model'),
    id := 'sample_id') GROUP BY feature ORDER BY avg(abs(shap_value)) DESC, feature LIMIT 1
- name: bmi_partial_dependence_range
  reference_sql:
  - SET VARIABLE pd_model = (SELECT model FROM xgboost.main.fit((SELECT * FROM xgboost.main.diabetes),
    estimator := 'xgb_regressor', target := 'target', id := 'sample_id'))
  - SELECT round(min(partial_dependence), 2) AS min_pd, round(max(partial_dependence), 2) AS max_pd FROM
    xgboost.main.partial_dependence((SELECT sample_id, age, sex, bmi, bp, s1, s2, s3, s4, s5, s6 FROM
    xgboost.main.diabetes), model := getvariable('pd_model'), feature := 'bmi', grid_resolution := 20)
- name: top_permutation_feature
  reference_sql:
  - SET VARIABLE perm_model = (SELECT model FROM xgboost.main.fit((SELECT * FROM xgboost.main.diabetes),
    estimator := 'xgb_regressor', target := 'target', id := 'sample_id'))
  - SELECT feature FROM xgboost.main.permutation_importance((SELECT * FROM xgboost.main.diabetes), model
    := getvariable('perm_model'), target := 'target', random_state := 42, n_repeats := 5) ORDER BY importance_mean
    DESC LIMIT 1
- name: fit_iris_train_accuracy
  reference_sql: SELECT round(train_score, 4) AS train_accuracy FROM xgboost.main.fit((SELECT * FROM xgboost.main.iris),
    estimator := 'xgb_classifier', target := 'target', id := 'sample_id')
- name: saved_model_info
  reference_sql:
  - SET VARIABLE wine_clf_m = (SELECT model_name FROM xgboost.main.fit((SELECT * FROM xgboost.main.wine),
    estimator := 'xgb_classifier', target := 'target', id := 'sample_id', model_name := 'wine_clf'))
  - SELECT target, n_features FROM xgboost.main.model_info('wine_clf')
- name: saved_model_listed
  reference_sql:
  - SET VARIABLE diab_saved_m = (SELECT model_name FROM xgboost.main.fit((SELECT * FROM xgboost.main.diabetes),
    estimator := 'xgb_regressor', target := 'target', id := 'sample_id', model_name := 'diab_saved'))
  - SELECT model_name, estimator, task FROM xgboost.main.list_models WHERE model_name = 'diab_saved'
- name: drop_saved_model
  reference_sql:
  - SET VARIABLE scratch_clf_m = (SELECT model_name FROM xgboost.main.fit((SELECT * FROM xgboost.main.iris),
    estimator := 'xgb_classifier', target := 'target', id := 'sample_id', model_name := 'scratch_clf'))
  - SELECT dropped FROM xgboost.main.drop_model('scratch_clf')
- name: iris_randomized_search_best
  reference_sql: 'SELECT round(max(mean_test_score), 4) AS best_cv_accuracy FROM xgboost.main.randomized_search((SELECT
    sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM xgboost.main.iris),
    target := ''target'', cv := 3, n_iter := 4, random_state := 0, estimator := union_value(xgb_classifier
    := {''n_estimators'': [25, 50, 100], ''max_depth'': [2, 3, 4]}))'
- name: breast_cancer_oof_missed_malignant
  reference_sql: SELECT count(*) AS n_missed_malignant FROM xgboost.main.cross_val_predict((SELECT * EXCLUDE
    (target_name) FROM xgboost.main.breast_cancer), estimator := 'xgb_classifier', target := 'target',
    id := 'sample_id', cv := 5) AS cv JOIN xgboost.main.breast_cancer AS b USING (sample_id) WHERE b.target
    = 0 AND cv.prediction = 1
