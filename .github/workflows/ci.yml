name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow the publish workflow (docker-publish.yml) to gate on this suite.
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint • types • unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install (package + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Unit tests
        run: pytest tests/ -o "addopts=" -q


  lint-metadata:
    name: vgi-lint-check (metadata quality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Install the worker
        run: uv venv && uv pip install -e .
      # Two passes, no severity overrides:
      #   1. static (execute: false), fail-on: warning — strict metadata gate
      #      (every description/tag/example/column-doc warning fails CI).
      #   2. execute, fail-on: error — runs every example's SQL live; a binding
      #      failure (or a broken vgi.executable_examples block) is an error and
      #      fails CI, while a purely illustrative runtime/return-rows warning
      #      does not. The handful of examples that read a *stored* model at bind
      #      (predict etc.) are scoped out via [tool.vgi-lint-check.per_object] in
      #      pyproject.
      - name: Lint worker metadata (static)
        uses: Query-farm/vgi-lint-check@v2
        with:
          # vgi-lint spawns this as a subprocess. Point at the venv interpreter
          # by path (not bare `python`): the action runs vgi-lint under uvx,
          # whose isolated env would otherwise shadow `python` and miss the
          # worker's deps (ModuleNotFoundError: No module named 'vgi').
          location: .venv/bin/python xgboost_worker.py
          execute: false
          fail-on: warning
      - name: Lint worker examples (execute)
        uses: Query-farm/vgi-lint-check@v2
        with:
          location: .venv/bin/python xgboost_worker.py
          execute: true
          fail-on: error

  # The SQL suite (test/sql/*.test) through the published haybarn-unittest and the
  # signed community `vgi` extension, over every transport (ci/run-integration.sh,
  # adapted from the vgi-starter template): stdio (DuckDB spawns the worker per
  # connection), launch (DuckDB starts it once on an AF_UNIX socket and pools
  # connections) and http (the worker serves --http).
  integration:
    name: SQL E2E (${{ matrix.transport }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        transport: [stdio, launch, http]
    env:
      UV_PYTHON: "3.14"
      HAYBARN_VERSION: "2.0.1rc3"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build the worker
        run: uv sync --locked --all-extras

      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"

      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          WORKER="$PWD/ci/worker" \
          HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest" \
          TRANSPORT=${{ matrix.transport }} ci/run-integration.sh
