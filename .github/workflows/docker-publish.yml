#
# Build and publish the multi-arch vgi-xgboost image to ghcr.io. The heavy
# lifting (multi-arch build → smoke → push → manifest → cosign-sign) lives in
# the shared reusable workflow Query-farm/vgi-actions; this file gates on the
# repo's own test suite and supplies the worker-specific inputs.
#
# Tag-driven: vX.Y.Z -> :X.Y.Z/:X.Y/:latest, push to release tags only (no :edge image on pushes to main). Decoupled
# from the PyPI publish. Publishing a GitHub Release creates the tag, which
# fires this too.
name: Publish image to ghcr.io

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate every image on the repo's full test suite, so a broken worker is never
  # imaged.
  ci-status:
    # A release tag usually points at a commit whose push to main already passed CI.
    # Reuse that result instead of running the whole CI matrix again; otherwise run CI below.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq .total_count || echo 0)
          echo "ci.yml successes for ${GITHUB_SHA}: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: [ci-status]
    if: ${{ needs.ci-status.outputs.passed != 'true' }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci-status, ci]
    if: ${{ !cancelled() && needs.ci-status.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/docker-publish.yml@v1
    secrets: inherit
    with:
      image_name: vgi-xgboost
      smoke_import: "vgi_xgboost, xgboost, sklearn, numpy, pandas"
      http_run_args: "-e VGI_SIGNING_KEY=dev"
